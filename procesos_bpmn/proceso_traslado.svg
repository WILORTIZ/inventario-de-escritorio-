<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 620" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-tras" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <filter id="shadow-tras" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Pool Header -->
  <rect x="30" y="30" width="1500" height="550" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="30" width="45" height="550" rx="8" fill="#0f172a"/>
  <text x="-315" y="60" transform="rotate(-90)" fill="#ffffff" font-size="15" font-weight="bold" letter-spacing="1">PROCESO DE TRASLADO ENTRE BODEGAS (INTER-BODEGAS)</text>

  <!-- Lanes -->
  <!-- Lane 1: Bodega Destino -->
  <rect x="75" y="30" width="1455" height="170" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="75" y="30" width="35" height="170" fill="#8b5cf6"/>
  <text x="-135" y="98" transform="rotate(-90)" fill="#ffffff" font-size="12" font-weight="bold">BODEGA DESTINO</text>

  <!-- Lane 2: Bodega Origen -->
  <rect x="75" y="200" width="1455" height="200" fill="#fcfdfe" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="75" y="200" width="35" height="200" fill="#0284c7"/>
  <text x="-315" y="98" transform="rotate(-90)" fill="#ffffff" font-size="12" font-weight="bold">BODEGA ORIGEN</text>

  <!-- Lane 3: Sistema CDS -->
  <rect x="75" y="400" width="1455" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="75" y="400" width="35" height="180" fill="#0f766e"/>
  <text x="-505" y="98" transform="rotate(-90)" fill="#ffffff" font-size="12" font-weight="bold">SISTEMA CDS</text>

  <!-- Flow Lines -->
  <!-- Start to Solicitar -->
  <path d="M 166 115 L 210 115" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Solicitar to Validar Stock Origen -->
  <path d="M 275 155 L 275 270" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Validar to Gateway Stock -->
  <path d="M 340 300 L 400 300" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Gateway Stock -> No (Cancelado) -->
  <path d="M 425 325 L 425 360" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <text x="432" y="348" font-size="11" font-weight="bold" fill="#ef4444">No</text>
  <!-- Gateway Stock -> Si (Picking) -->
  <path d="M 450 300 L 510 300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <text x="465" y="290" font-size="11" font-weight="bold" fill="#10b981">Sí</text>
  <!-- Picking to Registrar Salida CDS -->
  <path d="M 575 340 L 575 450" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Registrar Salida to Recepción en Destino -->
  <path d="M 640 490 L 780 490 L 780 155" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Recepción to Gateway Conformidad -->
  <path d="M 845 115 L 900 115" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Gateway Conformidad -> No (Discrepancia) -->
  <path d="M 925 140 L 925 170 L 980 170" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <text x="930" y="160" font-size="10" font-weight="bold" fill="#d97706">Discrepancia</text>
  <!-- Gateway Conformidad -> Si (Ubicar) -->
  <path d="M 950 115 L 1150 115" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <text x="980" y="105" font-size="11" font-weight="bold" fill="#10b981">Conforme</text>
  <!-- Discrepancia to Ubicar -->
  <path d="M 1110 170 L 1215 170 L 1215 155" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Ubicar to Confirmar Recepción CDS -->
  <path d="M 1215 155 L 1215 450" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>
  <!-- Confirmar to Fin -->
  <path d="M 1280 490 L 1380 490" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-tras)"/>

  <!-- NODES -->
  <!-- Start Event -->
  <circle cx="145" cy="115" r="18" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow-tras)"/>
  <circle cx="145" cy="115" r="8" fill="#7c3aed"/>
  <text x="145" y="152" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Necesidad Stock</text>

  <!-- User Task Solicitar -->
  <rect x="210" y="75" width="130" height="80" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="275" y="105" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Solicitar Traslado</text>
  <text x="275" y="122" font-size="10" fill="#64748b" text-anchor="middle">Ítem, Cantidad, Bodega</text>
  <text x="275" y="137" font-size="10" fill="#64748b" text-anchor="middle">Origen y Destino</text>

  <!-- Task Validar Origen -->
  <rect x="210" y="270" width="130" height="65" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="275" y="295" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Validar Existencias</text>
  <text x="275" y="312" font-size="10" fill="#64748b" text-anchor="middle">Saldo en Bodega Origen</text>
  <text x="275" y="325" font-size="10" fill="#64748b" text-anchor="middle">y disponibilidad</text>

  <!-- Gateway Stock Origen -->
  <polygon points="425,275 450,300 425,325 400,300" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="425" y="304" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">✕</text>
  <text x="425" y="265" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">¿Stock en Origen?</text>

  <!-- End Event Cancelado -->
  <circle cx="425" cy="375" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow-tras)"/>
  <text x="425" y="405" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="middle">Cancelado</text>

  <!-- Task Picking & Despacho -->
  <rect x="510" y="260" width="130" height="80" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="575" y="290" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Picking y Embalaje</text>
  <text x="575" y="307" font-size="10" fill="#64748b" text-anchor="middle">Rotulación y despacho</text>
  <text x="575" y="322" font-size="10" fill="#64748b" text-anchor="middle">físico a transporte</text>

  <!-- Task Registrar Salida CDS -->
  <rect x="510" y="450" width="130" height="80" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="575" y="480" font-size="11" font-weight="bold" fill="#115e59" text-anchor="middle">Registrar 'TRASLADO'</text>
  <text x="575" y="497" font-size="10" fill="#047857" text-anchor="middle">Movimiento (↔)</text>
  <text x="575" y="512" font-size="10" fill="#64748b" text-anchor="middle">Descuenta en Origen</text>

  <!-- Task Recibir en Destino -->
  <rect x="715" y="75" width="130" height="80" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="780" y="105" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Recepción en Destino</text>
  <text x="780" y="122" font-size="10" fill="#64748b" text-anchor="middle">Conteo físico y</text>
  <text x="780" y="137" font-size="10" fill="#64748b" text-anchor="middle">cotejo vs Guía</text>

  <!-- Gateway Conformidad -->
  <polygon points="925,90 950,115 925,140 900,115" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="925" y="119" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">✕</text>
  <text x="925" y="80" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">¿Conforme?</text>

  <!-- Task Reportar Discrepancia -->
  <rect x="980" y="145" width="130" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow-tras)"/>
  <text x="1045" y="165" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Reportar Novedad</text>
  <text x="1045" y="180" font-size="9" fill="#b45309" text-anchor="middle">Observaciones de Ajuste</text>

  <!-- Task Ubicación Destino -->
  <rect x="1150" y="75" width="130" height="80" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="1215" y="105" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Ubicación Física</text>
  <text x="1215" y="122" font-size="10" fill="#64748b" text-anchor="middle">Almacenaje en estante</text>
  <text x="1215" y="137" font-size="10" fill="#64748b" text-anchor="middle">de Bodega Destino</text>

  <!-- Task Confirmar Saldo CDS -->
  <rect x="1150" y="450" width="130" height="80" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" filter="url(#shadow-tras)"/>
  <text x="1215" y="480" font-size="11" font-weight="bold" fill="#115e59" text-anchor="middle">Acreditar Saldo</text>
  <text x="1215" y="497" font-size="10" fill="#047857" text-anchor="middle">Incrementa en Destino</text>
  <text x="1215" y="512" font-size="10" fill="#64748b" text-anchor="middle">y cierra ciclo Kardex</text>

  <!-- End Event Exitoso -->
  <circle cx="1400" cy="490" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4" filter="url(#shadow-tras)"/>
  <text x="1400" y="525" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Traslado Completo</text>
</svg>
