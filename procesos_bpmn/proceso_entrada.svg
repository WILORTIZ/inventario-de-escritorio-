<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 620" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-ent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <filter id="shadow-ent" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Pool Header -->
  <rect x="30" y="30" width="1420" height="550" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="30" width="45" height="550" rx="8" fill="#0f172a"/>
  <text x="-315" y="60" transform="rotate(-90)" fill="#ffffff" font-size="15" font-weight="bold" letter-spacing="1">PROCESO DE ENTRADA Y RECEPCIÓN DE COMPRAS (CDS)</text>

  <!-- Lanes -->
  <!-- Lane 1: Proveedor -->
  <rect x="75" y="30" width="1375" height="170" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="75" y="30" width="35" height="170" fill="#f59e0b"/>
  <text x="-135" y="98" transform="rotate(-90)" fill="#ffffff" font-size="12" font-weight="bold">PROVEEDOR</text>

  <!-- Lane 2: Almacén -->
  <rect x="75" y="200" width="1375" height="200" fill="#fcfdfe" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="75" y="200" width="35" height="200" fill="#0284c7"/>
  <text x="-315" y="98" transform="rotate(-90)" fill="#ffffff" font-size="12" font-weight="bold">ALMACÉN CDS</text>

  <!-- Lane 3: Sistema CDS -->
  <rect x="75" y="400" width="1375" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="75" y="400" width="35" height="180" fill="#0f766e"/>
  <text x="-505" y="98" transform="rotate(-90)" fill="#ffffff" font-size="12" font-weight="bold">SISTEMA CDS</text>

  <!-- Flow Lines -->
  <!-- Start to Presentar Factura -->
  <path d="M 166 115 L 210 115" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <!-- Presentar to Inspección Física -->
  <path d="M 275 155 L 275 270" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <!-- Inspección to Gateway Conformidad -->
  <path d="M 340 300 L 410 300" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <!-- Gateway -> No (Rechazo) -->
  <path d="M 435 325 L 435 365 L 500 365" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <text x="442" y="352" font-size="11" font-weight="bold" fill="#ef4444">No Conforme</text>
  <!-- Gateway -> Si (Lote) -->
  <path d="M 435 275 L 435 245 L 500 245" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <text x="442" y="235" font-size="11" font-weight="bold" fill="#10b981">Sí (Conforme)</text>
  <!-- Rechazo to Fin Rechazo -->
  <path d="M 630 365 L 680 365" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <!-- Lote to Ubicar en Estante -->
  <path d="M 630 245 L 690 245" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <!-- Ubicar to Registrar Entrada CDS -->
  <path d="M 755 285 L 755 490 L 820 490" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <!-- Registrar to Actualizar Saldo -->
  <path d="M 950 490 L 1000 490" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>
  <!-- Actualizar Saldo to Fin -->
  <path d="M 1130 490 L 1180 490" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow-ent)"/>

  <!-- NODES -->
  <!-- Start Event -->
  <circle cx="145" cy="115" r="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#shadow-ent)"/>
  <circle cx="145" cy="115" r="8" fill="#d97706"/>
  <text x="145" y="152" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Llegada Carga</text>

  <!-- User Task Presentar -->
  <rect x="210" y="75" width="130" height="80" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow-ent)"/>
  <text x="275" y="105" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Entregar Factura</text>
  <text x="275" y="122" font-size="10" fill="#64748b" text-anchor="middle">Remisión / OC</text>
  <text x="275" y="137" font-size="10" fill="#64748b" text-anchor="middle">y descarga de bultos</text>

  <!-- Task Inspección -->
  <rect x="210" y="270" width="130" height="65" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow-ent)"/>
  <text x="275" y="295" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Inspección Física</text>
  <text x="275" y="312" font-size="10" fill="#64748b" text-anchor="middle">Conteo cuantitativo</text>
  <text x="275" y="325" font-size="10" fill="#64748b" text-anchor="middle">y estado de empaque</text>

  <!-- Gateway Conformidad -->
  <polygon points="435,275 460,300 435,325 410,300" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow-ent)"/>
  <text x="435" y="304" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">✕</text>
  <text x="435" y="265" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">¿Conforme?</text>

  <!-- Task Rechazo -->
  <rect x="500" y="335" width="130" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow-ent)"/>
  <text x="565" y="357" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">Rechazo a Proveedor</text>
  <text x="565" y="372" font-size="9" fill="#dc2626" text-anchor="middle">Devolución y Novedad</text>

  <!-- End Event Rechazo -->
  <circle cx="695" cy="365" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow-ent)"/>
  <text x="695" y="395" font-size="9" font-weight="600" fill="#b91c1c" text-anchor="middle">Entrada Rechazada</text>

  <!-- Task Lote -->
  <rect x="500" y="215" width="130" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow-ent)"/>
  <text x="565" y="238" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Validar Lote y Vence</text>
  <text x="565" y="253" font-size="10" fill="#64748b" text-anchor="middle">Fecha del fabricante</text>

  <!-- Task Ubicar -->
  <rect x="690" y="215" width="130" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow-ent)"/>
  <text x="755" y="238" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Ubicar en Estante</text>
  <text x="755" y="253" font-size="10" fill="#64748b" text-anchor="middle">Posición CDS asignada</text>

  <!-- Task Registrar Entrada CDS -->
  <rect x="820" y="450" width="130" height="80" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" filter="url(#shadow-ent)"/>
  <text x="885" y="480" font-size="11" font-weight="bold" fill="#115e59" text-anchor="middle">Registrar 'ENTRADA'</text>
  <text x="885" y="497" font-size="10" fill="#047857" text-anchor="middle">Movimiento (+) con Factura</text>
  <text x="885" y="512" font-size="10" fill="#64748b" text-anchor="middle">y Lote de Fabricante</text>

  <!-- Task Actualizar Kardex -->
  <rect x="1000" y="450" width="130" height="80" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" filter="url(#shadow-ent)"/>
  <text x="1065" y="480" font-size="11" font-weight="bold" fill="#115e59" text-anchor="middle">Incrementar Stock</text>
  <text x="1065" y="497" font-size="10" fill="#64748b" text-anchor="middle">Saldo físico actualizado</text>
  <text x="1065" y="512" font-size="10" fill="#64748b" text-anchor="middle">y asiento en Kardex</text>

  <!-- End Event Exitoso -->
  <circle cx="1200" cy="490" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4" filter="url(#shadow-ent)"/>
  <text x="1200" y="525" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Entrada Registrada</text>
</svg>
